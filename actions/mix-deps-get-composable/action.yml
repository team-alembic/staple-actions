name: mix deps.get
description: "Download and install the hex dependencies (with cache)"
inputs:
  git-token:
    required: false
    default: ${{ github.token }}
    description: "A Github access token for checking out git-based dependencies."
  working-directory:
    description: "Change the working directory that the commands are run within"
    required: false
    default: "${{ github.workspace }}"
  use-cache:
    description: "Use caches?"
    required: false
    default: "true"
  cache-prefix:
    description: "Optional prefix for the cache key"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Retrieve MIX_HOME Cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ${{ runner.temp }}/.mix
        key: ${{ inputs.cache-prefix }}-mix-home-${{ hashFiles(format('{0}{1}', inputs.working-directory, '/mix.lock')) }}
      if: ${{ inputs.use-cache == 'true' }}
    - name: Retrieve HEX_HOME Cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ${{ runner.temp }}/.hex
        key: ${{ inputs.cache-prefix }}-hex-home-${{ hashFiles(format('{0}{1}', inputs.working-directory, '/mix.lock')) }}
      if: ${{ inputs.use-cache == 'true' }}
    # Cache the extracted `deps/` sources, not just the tarball stores above.
    # Without this, `mix deps.get` re-extracts every dep on each run with fresh
    # mtimes, which makes a later `mix compile` / `mix deps.compile` treat the
    # cached _build artifacts as stale and recompile them. Restoring deps/ here
    # (before deps.get) keeps mtimes stable so downstream compilation is a
    # genuine no-op on a cache hit.
    - name: Retrieve deps Cache
      id: deps-cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ${{ inputs.working-directory }}/deps
        key: ${{ inputs.cache-prefix }}-deps-${{ hashFiles(format('{0}{1}', inputs.working-directory, '/mix.lock')) }}
      if: ${{ inputs.use-cache == 'true' }}
    - name: Configure git access (HTTPS)
      run: git config --global url."https://x-access-token:${{ inputs.git-token }}@github.com/".insteadOf "https://github.com/"
      shell: bash
      working-directory: "${{ inputs.working-directory }}"
    - name: Configure git access (SSH)
      run: git config --global url."https://x-access-token:${{ inputs.git-token }}@github.com/".insteadOf "git@github.com:"
      shell: bash
      working-directory: "${{ inputs.working-directory }}"
    - name: Install Hex
      shell: bash
      run: mix local.hex --if-missing --force
      env:
        HEX_HOME: ${{ runner.temp }}/.hex
        MIX_HOME: ${{ runner.temp }}/.mix
      working-directory: "${{ inputs.working-directory }}"
    - name: Install Rebar
      shell: bash
      run: mix local.rebar --if-missing --force
      env:
        HEX_HOME: ${{ runner.temp }}/.hex
        MIX_HOME: ${{ runner.temp }}/.mix
      working-directory: "${{ inputs.working-directory }}"
    - name: Install Mix Dependencies
      shell: bash
      run: mix deps.get
      env:
        HEX_HOME: ${{ runner.temp }}/.hex
        MIX_HOME: ${{ runner.temp }}/.mix
      working-directory: "${{ inputs.working-directory }}"
    # Save deps/ inline (not in a post step) so it persists even when a later
    # pipeline step — tests, lint — fails: the fetched sources are valid
    # regardless. The implied success() on this `if` still skips the save if
    # deps.get itself failed, so we never cache a broken fetch. Only saves on a
    # miss to avoid redundant writes.
    - name: Save deps Cache
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ${{ inputs.working-directory }}/deps
        key: ${{ inputs.cache-prefix }}-deps-${{ hashFiles(format('{0}{1}', inputs.working-directory, '/mix.lock')) }}
      if: ${{ inputs.use-cache == 'true' && steps.deps-cache.outputs.cache-hit != 'true' }}
