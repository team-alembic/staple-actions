name: mix compile
description: "Run `mix compile` with a build cache"
inputs:
  mix-env:
    description: "The Mix environment to compile within"
    required: true
  working-directory:
    description: "Change the working directory that the commands are run within"
    required: false
    default: "${{ github.workspace }}"
  use-cache:
    description: "Use caches?"
    required: false
    default: "true"
  cache-prefix:
    description: "Optional prefix for the cache key"
    required: false
    default: ""
  args:
    description: "Additional CLI arguments to pass to mix compile"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    # The build cache carries deps/ alongside _build so that a git dep which
    # builds a NIF into its Mix-symlinked priv dir (e.g. exla) — where the
    # built `.so` lands inside deps/, not _build — has that artifact cached
    # with the rest of the compiled output. mix-deps-get still restores its own
    # mix.lock-keyed deps/ source cache before deps.get; extracting that over
    # this deps/ leaves the `.so` in place. See issue #23.
    - name: Retrieve Build Cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      id: build-cache
      with:
        path: |
          ${{ inputs.working-directory }}/_build
          ${{ inputs.working-directory }}/deps
        key: ${{ inputs.cache-prefix}}-build-${{ inputs.mix-env }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}{1}', inputs.working-directory, '/.tool-versions')) }}-${{ hashFiles(format('{0}{1}', inputs.working-directory, '/mix.lock')) }}
      if: ${{ inputs.use-cache == 'true' }}
    - run: mix compile ${{ inputs.args }}
      shell: bash
      env:
        MIX_ENV: ${{ inputs.mix-env }}
        HEX_HOME: ${{ runner.temp }}/.hex
        MIX_HOME: ${{ runner.temp }}/.mix
      working-directory: "${{ inputs.working-directory }}"
